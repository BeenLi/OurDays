name: iOS CI

# Docs-only changes (README, docs/plantree, docs/site, CLAUDE.md) can't break
# the app, so they don't start a macOS runner at all. A PR that touches both
# docs and code still runs: paths-ignore only skips when *every* file matches.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    env:
      # PRs build and run only the unit tests, through the OurDaysTests scheme.
      # That scheme contains just the hostless test bundle (it compiles the
      # non-UI sources itself), so a PR never compiles the SwiftUI views, the
      # asset catalog or the UI test runner. -only-testing alone didn't do that:
      # build-for-testing still built every target in the OurDays scheme.
      # The three CI-runnable UI tests run after merge on main (and on manual
      # dispatch), where nobody is waiting. The other three UI tests always
      # XCTSkip outside Scripts/dev-pairing-smoke.sh.
      SCHEME: ${{ github.event_name == 'pull_request' && 'OurDaysTests' || 'OurDays' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      # Experiment: on hosted runners xcodebuild has been sitting silent for ~2 min
      # before printing anything, which matches it waiting on Apple's developer
      # services endpoint. Builds here are unsigned, so nothing needs that host.
      - name: Skip Apple developer services lookup
        run: sudo sh -c 'echo "127.0.0.1 developerservices2.apple.com" >> /etc/hosts'

      # Create and boot the simulator in the background. Creating it alone took
      # 30 s to 3 min, and nothing in the build needs it: the build targets the
      # generic simulator platform (arm64 only, like the device it later runs
      # on), so the whole simulator setup overlaps the build.
      - name: Start creating and booting the iOS simulator
        run: |
          (
            set -euo pipefail

            # Use the runtime that matches the selected Xcode's simulator SDK. The
            # image also ships newer runtimes (iOS 26.x next to Xcode 16.4), and
            # building against a mismatched one made xcodebuild spend minutes
            # resolving the destination and asking actool for device traits.
            SDK_VERSION=$(xcrun --sdk iphonesimulator --show-sdk-version)
            RUNTIME_ID=$(
              xcrun simctl list runtimes \
                | awk -F ' - ' -v v="iOS ${SDK_VERSION} " 'index($0, v) == 1 && !/unavailable/ { runtime=$NF } END { print runtime }'
            )
            if [[ -z "${RUNTIME_ID}" ]]; then
              RUNTIME_ID=$(
                xcrun simctl list runtimes \
                  | awk -F ' - ' '/iOS/ && !/unavailable/ { runtime=$NF } END { print runtime }'
              )
            fi

            # Pick an iPhone the chosen runtime supports (iOS 18 can't run an iPhone 17).
            DEVICE_TYPE=$(
              xcrun simctl list runtimes -j | python3 -c '
          import json, sys
          rid = sys.argv[1]
          rt = next((r for r in json.load(sys.stdin)["runtimes"] if r["identifier"] == rid), None)
          phones = [d for d in (rt or {}).get("supportedDeviceTypes", []) if d.get("productFamily") == "iPhone"]
          pick = next((d for d in phones if d["name"] == "iPhone 16 Pro"), phones[-1] if phones else None)
          print(pick["identifier"] if pick else "")
          ' "${RUNTIME_ID}"
            )
            echo "Simulator SDK ${SDK_VERSION}, runtime ${RUNTIME_ID}, device ${DEVICE_TYPE}"

            if [[ -z "${DEVICE_TYPE}" || -z "${RUNTIME_ID}" ]]; then
              echo "No available iOS simulator device type or runtime found." >&2
              xcrun simctl list runtimes >&2
              exit 1
            fi

            SIMULATOR_UDID=$(xcrun simctl create "OurDays CI iPhone" "${DEVICE_TYPE}" "${RUNTIME_ID}")
            xcrun simctl boot "${SIMULATOR_UDID}" || true
            echo "${SIMULATOR_UDID}" > "${RUNNER_TEMP}/simulator-udid"
          ) > "${RUNNER_TEMP}/simulator.log" 2>&1 &

      - name: Build for testing
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project OurDays.xcodeproj \
            -scheme "${SCHEME}" \
            -destination "generic/platform=iOS Simulator" \
            -derivedDataPath "${RUNNER_TEMP}/OurDaysDerivedData" \
            ARCHS=arm64 \
            CODE_SIGNING_ALLOWED=NO

      - name: Wait for simulator boot
        id: simulator
        run: |
          set -euo pipefail
          for _ in $(seq 1 300); do
            [[ -s "${RUNNER_TEMP}/simulator-udid" ]] && break
            sleep 1
          done
          cat "${RUNNER_TEMP}/simulator.log"
          SIMULATOR_UDID=$(cat "${RUNNER_TEMP}/simulator-udid")
          xcrun simctl bootstatus "${SIMULATOR_UDID}" -b
          echo "udid=${SIMULATOR_UDID}" >> "${GITHUB_OUTPUT}"

      - name: Run tests
        run: |
          set -euo pipefail

          # UI tests drive a simulator on a shared CI runner; when the runner is
          # overloaded, app.launch() wait-for-idle can balloon (~45s observed) and
          # short XCUIElement waits expire mid-render, failing a healthy build.
          # Retry only the tests that fail so a transient slowdown can't sink the run;
          # a genuinely broken test still fails after exhausting its iterations.
          #
          # Parallel testing is off: the unit tests finish in seconds, and turning it
          # on makes xcodebuild clone the simulator first, which costs more than it saves.
          xcodebuild test-without-building \
            -project OurDays.xcodeproj \
            -scheme "${SCHEME}" \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "${RUNNER_TEMP}/OurDaysDerivedData" \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 3
