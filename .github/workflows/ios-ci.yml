name: iOS CI

# Docs-only changes (README, docs/plantree, docs/site, CLAUDE.md) can't break
# the app, so they don't start a macOS runner at all. A PR that touches both
# docs and code still runs: paths-ignore only skips when *every* file matches.
on:
  push:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Build and test
    runs-on: macos-15
    timeout-minutes: 30

    env:
      # PRs run only the unit tests (~20 s). The three CI-runnable UI tests cost
      # ~3 min of runner install + automation-session setup, so they run after
      # merge on main (and on manual dispatch), where nobody is waiting.
      # The other three UI tests always XCTSkip outside Scripts/dev-pairing-smoke.sh.
      ONLY_TESTING: ${{ github.event_name == 'pull_request' && '-only-testing:CoupleCalendarTests' || '' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      # Experiment: on hosted runners xcodebuild has been sitting silent for ~2 min
      # before printing anything, which matches it waiting on Apple's developer
      # services endpoint. Builds here are unsigned, so nothing needs that host.
      - name: Skip Apple developer services lookup
        run: sudo sh -c 'echo "127.0.0.1 developerservices2.apple.com" >> /etc/hosts'

      # Booting while building was tried in #31 and the build got ~2 min slower: actool
      # (which talks to the simulator runtime) stalled ~100 s during the boot. So the
      # simulator is fully booted first, then the build runs on a quiet machine.
      - name: Create and boot iOS simulator
        id: simulator
        run: |
          set -euo pipefail

          DEVICE_TYPE=$(
            xcrun simctl list devicetypes \
              | awk -F '[()]' '/iPhone 16 Pro/ { print $2; exit } /iPhone 16/ { print $2; exit } /iPhone 15/ { print $2; exit } /iPhone/ { print $2; exit }'
          )

          RUNTIME_ID=$(
            xcrun simctl list runtimes \
              | awk -F ' - ' '/iOS/ && !/unavailable/ { runtime=$NF } END { print runtime }'
          )

          if [[ -z "${DEVICE_TYPE}" || -z "${RUNTIME_ID}" ]]; then
            echo "No available iOS simulator device type or runtime found." >&2
            xcrun simctl list runtimes >&2
            exit 1
          fi

          SIMULATOR_UDID=$(xcrun simctl create "CoupleCalendar CI iPhone" "${DEVICE_TYPE}" "${RUNTIME_ID}")
          xcrun simctl boot "${SIMULATOR_UDID}" || true
          xcrun simctl bootstatus "${SIMULATOR_UDID}" -b

          echo "udid=${SIMULATOR_UDID}" >> "${GITHUB_OUTPUT}"

      - name: Build for testing
        run: |
          set -euo pipefail
          xcodebuild build-for-testing \
            -project CoupleCalendar.xcodeproj \
            -scheme CoupleCalendar \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "${RUNNER_TEMP}/CoupleCalendarDerivedData" \
            ${ONLY_TESTING} \
            CODE_SIGNING_ALLOWED=NO

      - name: Run tests
        run: |
          set -euo pipefail

          # UI tests drive a simulator on a shared CI runner; when the runner is
          # overloaded, app.launch() wait-for-idle can balloon (~45s observed) and
          # short XCUIElement waits expire mid-render, failing a healthy build.
          # Retry only the tests that fail so a transient slowdown can't sink the run;
          # a genuinely broken test still fails after exhausting its iterations.
          #
          # Parallel testing is off: the unit tests finish in seconds, and turning it
          # on makes xcodebuild clone the simulator first, which costs more than it saves.
          xcodebuild test-without-building \
            -project CoupleCalendar.xcodeproj \
            -scheme CoupleCalendar \
            -destination "platform=iOS Simulator,id=${{ steps.simulator.outputs.udid }}" \
            -derivedDataPath "${RUNNER_TEMP}/CoupleCalendarDerivedData" \
            ${ONLY_TESTING} \
            -parallel-testing-enabled NO \
            -retry-tests-on-failure \
            -test-iterations 3
