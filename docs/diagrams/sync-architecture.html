<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OurDays 数据同步架构</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFFFF; --paper-2: #F1EEE8; --surface: #FFFFFF;
    --ink: #1E2233; --muted: #3F4456; --soft: #3F4456;
    --rule: rgba(30,34,51,0.22); --rule-solid: #C9C4BA;
    --accent: #1F7A84; --accent-tint: rgba(31,122,132,0.08);
    --link: #B3283A; --ext-fill: rgba(30,34,51,0.04); --ext-stroke: rgba(30,34,51,0.55);
    --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'WenQuanYi Zen Hei', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
    --font-mono: 'Geist Mono', ui-monospace, Menlo, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--paper); color: var(--ink); padding: 2.5rem 16px 3rem; }
  .frame { max-width: 1280px; margin: 0 auto; }
  .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.5rem; }
  h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; line-height: 1.2; margin: 0 0 1.25rem; }
  .diagram-container { width: 100%; overflow-x: auto; }
  svg { width: 100%; min-width: 1280px; display: block; }
  @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Architecture · OurDays</p>
  <h1>两个私有 zone，各自一条 CKShare，互相只读</h1>
  <div class="diagram-container">
    <svg viewBox="0 0 1280 600" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ourdays-sync-arch-title ourdays-sync-arch-desc" font-family="var(--font-sans)">
      <title id="ourdays-sync-arch-title">OurDays 数据同步架构</title>
      <desc id="ourdays-sync-arch-desc">两人各自把系统日历镜像进自己 iCloud 私有数据库的 CoupleSpace zone，通过一条 CKShare 共享给对方；对方经共享数据库只读，对彼此数据的回应写进对方的 zone。</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--link)"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="var(--paper)"/>

      <!-- ZONES -->
      <rect x="48" y="72" width="272" height="416" rx="8" fill="rgba(30,34,51,0.02)" stroke="rgba(30,34,51,0.10)" stroke-width="0.8"/>
      <rect x="64" y="76" width="88" height="16" rx="2" fill="var(--paper)"/>
      <text x="108" y="88" fill="var(--soft)" font-size="12" font-weight="500" text-anchor="middle">A 的设备</text>
      <rect x="400" y="72" width="496" height="416" rx="8" fill="rgba(30,34,51,0.02)" stroke="rgba(30,34,51,0.10)" stroke-width="0.8"/>
      <rect x="416" y="76" width="144" height="16" rx="2" fill="var(--paper)"/>
      <text x="488" y="88" fill="var(--soft)" font-size="12" font-weight="500" text-anchor="middle">iCloud · CloudKit</text>
      <rect x="960" y="72" width="272" height="416" rx="8" fill="rgba(30,34,51,0.02)" stroke="rgba(30,34,51,0.10)" stroke-width="0.8"/>
      <rect x="976" y="76" width="88" height="16" rx="2" fill="var(--paper)"/>
      <text x="1020" y="88" fill="var(--soft)" font-size="12" font-weight="500" text-anchor="middle">B 的设备</text>

      <!-- ARROWS -->
      <line x1="184" y1="400" x2="184" y2="192" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="116" y="288" width="60" height="16" rx="2" fill="var(--paper)"/>
      <text x="146" y="300" fill="var(--soft)" font-size="12" font-weight="500" text-anchor="middle">重建镜像</text>
      <line x1="304" y1="152" x2="416" y2="152" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
      <rect x="340" y="130" width="40" height="16" rx="2" fill="var(--paper)"/>
      <text x="360" y="142" fill="var(--accent)" font-size="12" font-weight="500" text-anchor="middle">写入</text>
      <path d="M816,152 H1016 Q1024,152 1024,160 V320" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="932" y="232" width="84" height="16" rx="2" fill="var(--paper)"/>
      <text x="974" y="244" fill="var(--soft)" font-size="12" font-weight="500" text-anchor="middle">经共享库读取</text>
      <path d="M480,360 H264 Q256,360 256,352 V192" fill="none" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <rect x="264" y="264" width="84" height="16" rx="2" fill="var(--paper)"/>
      <text x="306" y="276" fill="var(--soft)" font-size="12" font-weight="500" text-anchor="middle">经共享库读取</text>
      <path d="M304,176 H360 Q368,176 368,184 V264 Q368,272 376,272 H632 Q640,272 640,280 V320" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="460" y="250" width="100" height="16" rx="2" fill="var(--paper)"/>
      <text x="510" y="262" fill="var(--soft)" font-size="12" font-weight="500" text-anchor="middle">回应对方的数据</text>
      <path d="M976,336 H920 Q912,336 912,328 V248 Q912,240 904,240 H568 Q560,240 560,232 V192" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="700" y="218" width="100" height="16" rx="2" fill="var(--paper)"/>
      <text x="750" y="230" fill="var(--soft)" font-size="12" font-weight="500" text-anchor="middle">回应对方的数据</text>
      <line x1="976" y1="360" x2="880" y2="360" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
      <rect x="908" y="366" width="40" height="16" rx="2" fill="var(--paper)"/>
      <text x="928" y="378" fill="var(--accent)" font-size="12" font-weight="500" text-anchor="middle">写入</text>
      <line x1="1096" y1="176" x2="1096" y2="320" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="1104" y="240" width="60" height="16" rx="2" fill="var(--paper)"/>
      <text x="1134" y="252" fill="var(--soft)" font-size="12" font-weight="500" text-anchor="middle">重建镜像</text>

      <!-- NODES -->
      <rect x="64" y="112" width="240" height="80" rx="6" fill="var(--paper)"/>
      <rect x="64" y="112" width="240" height="80" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.3"/>
      <rect x="72" y="118" width="28" height="12" rx="2" fill="transparent" stroke="var(--rule-solid)" stroke-width="0.8"/>
      <text x="86" y="127" fill="var(--muted)" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="184" y="152" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle">SyncCoordinator</text>
      <text x="184" y="168" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">foregroundSync · 唯一的同步管线</text>
      <text x="184" y="181" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">SwiftData 只做本地缓存</text>
      <rect x="64" y="400" width="240" height="64" rx="6" fill="var(--paper)"/>
      <rect x="64" y="400" width="240" height="64" rx="6" fill="var(--ext-fill)" stroke="var(--ext-stroke)" stroke-width="1.3"/>
      <rect x="72" y="406" width="28" height="12" rx="2" fill="transparent" stroke="var(--rule-solid)" stroke-width="0.8"/>
      <text x="86" y="415" fill="var(--muted)" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">SYS</text>
      <text x="184" y="436" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle">系统日历</text>
      <text x="184" y="452" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">EventKit · 所选日历 · 数据源头</text>
      <rect x="416" y="112" width="288" height="80" rx="6" fill="var(--paper)"/>
      <rect x="416" y="112" width="288" height="80" rx="6" fill="var(--paper-2)" stroke="var(--muted)" stroke-width="1.3"/>
      <rect x="424" y="118" width="36" height="12" rx="2" fill="transparent" stroke="var(--rule-solid)" stroke-width="0.8"/>
      <text x="442" y="127" fill="var(--muted)" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">ZONE</text>
      <text x="560" y="152" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle">A 的私有 zone · CoupleSpace</text>
      <text x="560" y="168" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">ownerName = A 的 userRecordID</text>
      <text x="560" y="181" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">root → Mirror · Invitation · Comment · Profile</text>
      <rect x="704" y="128" width="112" height="48" rx="6" fill="var(--paper)"/>
      <rect x="704" y="128" width="112" height="48" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
      <text x="760" y="150" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle">CKShare</text>
      <text x="760" y="166" fill="var(--accent)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">zone 的门 · 链接邀请</text>
      <rect x="480" y="336" width="112" height="48" rx="6" fill="var(--paper)"/>
      <rect x="480" y="336" width="112" height="48" rx="6" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
      <text x="536" y="358" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle">CKShare</text>
      <text x="536" y="374" fill="var(--accent)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">zone 的门 · 链接邀请</text>
      <rect x="592" y="320" width="288" height="80" rx="6" fill="var(--paper)"/>
      <rect x="592" y="320" width="288" height="80" rx="6" fill="var(--paper-2)" stroke="var(--muted)" stroke-width="1.3"/>
      <rect x="600" y="326" width="36" height="12" rx="2" fill="transparent" stroke="var(--rule-solid)" stroke-width="0.8"/>
      <text x="618" y="335" fill="var(--muted)" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">ZONE</text>
      <text x="736" y="360" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle">B 的私有 zone · CoupleSpace</text>
      <text x="736" y="376" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">ownerName = B 的 userRecordID</text>
      <text x="736" y="389" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">root → Mirror · Invitation · Comment · Profile</text>
      <rect x="976" y="112" width="240" height="64" rx="6" fill="var(--paper)"/>
      <rect x="976" y="112" width="240" height="64" rx="6" fill="var(--ext-fill)" stroke="var(--ext-stroke)" stroke-width="1.3"/>
      <rect x="984" y="118" width="28" height="12" rx="2" fill="transparent" stroke="var(--rule-solid)" stroke-width="0.8"/>
      <text x="998" y="127" fill="var(--muted)" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">SYS</text>
      <text x="1096" y="148" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle">系统日历</text>
      <text x="1096" y="164" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">EventKit · 所选日历 · 数据源头</text>
      <rect x="976" y="320" width="240" height="80" rx="6" fill="var(--paper)"/>
      <rect x="976" y="320" width="240" height="80" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.3"/>
      <rect x="984" y="326" width="28" height="12" rx="2" fill="transparent" stroke="var(--rule-solid)" stroke-width="0.8"/>
      <text x="998" y="335" fill="var(--muted)" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">APP</text>
      <text x="1096" y="360" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle">SyncCoordinator</text>
      <text x="1096" y="376" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">foregroundSync · 唯一的同步管线</text>
      <text x="1096" y="389" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">SwiftData 只做本地缓存</text>

      <!-- LEGEND -->
      <line x1="48" y1="520" x2="1232" y2="520" stroke="var(--rule)" stroke-width="0.8"/>
      <text x="48" y="541" fill="var(--muted)" font-size="8" font-family="var(--font-mono)" letter-spacing="0.14em">LEGEND</text>
      <rect x="124" y="532" width="20" height="12" rx="2" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1"/>
      <text x="152" y="542" fill="var(--ink)" font-size="12" font-weight="500">CKShare：zone 的门，对方由此只读</text>
      <rect x="400" y="532" width="20" height="12" rx="2" fill="var(--paper-2)" stroke="var(--muted)" stroke-width="1.3"/>
      <text x="428" y="542" fill="var(--ink)" font-size="12" font-weight="500">私有数据库里的 zone</text>
      <rect x="580" y="532" width="20" height="12" rx="2" fill="var(--ext-fill)" stroke="var(--ext-stroke)" stroke-width="1.3"/>
      <text x="608" y="542" fill="var(--ink)" font-size="12" font-weight="500">系统框架</text>
      <line x1="700" y1="538" x2="732" y2="538" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
      <text x="742" y="542" fill="var(--ink)" font-size="12" font-weight="500">写自己的数据</text>
      <line x1="848" y1="538" x2="880" y2="538" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <text x="890" y="542" fill="var(--ink)" font-size="12" font-weight="500">评论 / 回应写进对方 zone</text>
      <line x1="1064" y1="538" x2="1096" y2="538" stroke="var(--muted)" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
      <text x="1106" y="542" fill="var(--ink)" font-size="12" font-weight="500">经共享数据库只读</text>
    </svg>
  </div>
</div>
</body>
</html>
