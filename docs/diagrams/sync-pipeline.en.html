<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>What one OurDays sync does</title>
<link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+SC:wght@400;500;600&family=Noto+Serif+SC:wght@400&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #FFFFFF; --paper-2: #F1EEE8; --surface: #FFFFFF;
    --ink: #1E2233; --muted: #3F4456; --soft: #3F4456;
    --rule: rgba(30,34,51,0.22); --rule-solid: #C9C4BA;
    --accent: #1F7A84; --accent-tint: rgba(31,122,132,0.08);
    --link: #B3283A; --ext-fill: rgba(30,34,51,0.04); --ext-stroke: rgba(30,34,51,0.55);
    --font-sans: 'Geist', 'Noto Sans SC', 'PingFang SC', 'WenQuanYi Zen Hei', system-ui, sans-serif;
    --font-serif: 'Instrument Serif', 'Noto Serif SC', 'Songti SC', serif;
    --font-mono: 'Geist Mono', ui-monospace, Menlo, monospace;
  }
  *, *::before, *::after { box-sizing: border-box; }
  body { margin: 0; font-family: var(--font-sans); background: var(--paper); color: var(--ink); padding: 2.5rem 16px 3rem; }
  .frame { max-width: 1280px; margin: 0 auto; }
  .eyebrow { font-family: var(--font-mono); font-size: 0.66rem; font-weight: 500; letter-spacing: 0.18em; text-transform: uppercase; color: var(--muted); margin: 0 0 0.5rem; }
  h1 { font-family: var(--font-serif); font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem); font-weight: 400; line-height: 1.2; margin: 0 0 1.25rem; }
  .diagram-container { width: 100%; overflow-x: auto; }
  svg { width: 100%; min-width: 1280px; display: block; }
  @media print { .diagram-container { overflow-x: visible; } svg { min-width: 0; } }
</style>
</head>
<body>
<div class="frame">
  <p class="eyebrow">Flowchart · OurDays</p>
  <h1>One sync: compute locally, settle pairing, then touch the cloud</h1>
  <div class="diagram-container">
    <svg viewBox="0 0 1280 560" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="ourdays-sync-flow-title ourdays-sync-flow-desc" font-family="var(--font-sans)">
      <title id="ourdays-sync-flow-title">What one OurDays sync does</title>
      <desc id="ourdays-sync-flow-desc">The order of SyncCoordinator.foregroundSync: get identity, rebuild mirrors from EventKit, compute tombstones and write the local cache, then settle pairing; on a conflict it stops without uploading or importing, otherwise it uploads only changes, imports the partner's zones in parallel, retries failed decisions and sends notifications.</desc>
      <defs>
        <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--muted)"/></marker>
        <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--accent)"/></marker>
        <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto"><polygon points="0 0, 8 3, 0 6" fill="var(--link)"/></marker>
      </defs>
      <rect width="100%" height="100%" fill="var(--paper)"/>

      <rect x="64" y="72" width="384" height="328" rx="8" fill="rgba(30,34,51,0.02)" stroke="rgba(30,34,51,0.10)" stroke-width="0.8"/>
      <rect x="80" y="76" width="168" height="16" rx="2" fill="var(--paper)"/>
      <text x="164" y="88" fill="var(--soft)" font-size="12" font-weight="500" text-anchor="middle">On device · every sync</text>
      <rect x="528" y="72" width="704" height="440" rx="8" fill="rgba(30,34,51,0.02)" stroke="rgba(30,34,51,0.10)" stroke-width="0.8"/>
      <rect x="544" y="76" width="184" height="16" rx="2" fill="var(--paper)"/>
      <text x="636" y="88" fill="var(--soft)" font-size="12" font-weight="500" text-anchor="middle">CloudKit · only once paired</text>

      <line x1="256" y1="176" x2="256" y2="208" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <line x1="256" y1="272" x2="256" y2="304" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <path d="M416,336 H480 Q488,336 488,328 V152 Q488,144 496,144 H600" fill="none" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <rect x="500" y="200" width="76" height="16" rx="2" fill="var(--paper)"/>
      <text x="538" y="212" fill="var(--soft)" font-size="12" font-weight="500" text-anchor="middle">local ready</text>
      <line x1="720" y1="192" x2="720" y2="224" stroke="var(--accent)" stroke-width="1.5" marker-end="url(#arrow-accent)"/>
      <rect x="732" y="196" width="76" height="16" rx="2" fill="var(--paper)"/>
      <text x="770" y="208" fill="var(--accent)" font-size="12" font-weight="500" text-anchor="middle">no conflict</text>
      <line x1="840" y1="144" x2="976" y2="144" stroke="var(--link)" stroke-width="1.5" marker-end="url(#arrow-link)"/>
      <rect x="868" y="122" width="60" height="16" rx="2" fill="var(--paper)"/>
      <text x="898" y="134" fill="var(--link)" font-size="12" font-weight="500" text-anchor="middle">conflict</text>
      <line x1="720" y1="288" x2="720" y2="320" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>
      <line x1="720" y1="384" x2="720" y2="416" stroke="var(--muted)" stroke-width="1.5" marker-end="url(#arrow)"/>

      <rect x="96" y="112" width="320" height="64" rx="6" fill="var(--paper)"/>
      <rect x="96" y="112" width="320" height="64" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.3"/>
      <rect x="104" y="118" width="24" height="12" rx="2" fill="transparent" stroke="var(--rule-solid)" stroke-width="0.8"/>
      <text x="116" y="127" fill="var(--muted)" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">01</text>
      <text x="256" y="148" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle">Get member identity</text>
      <text x="256" y="164" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">userRecordID → SettingsStore.currentMemberID</text>

      <rect x="96" y="208" width="320" height="64" rx="6" fill="var(--paper)"/>
      <rect x="96" y="208" width="320" height="64" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.3"/>
      <rect x="104" y="214" width="24" height="12" rx="2" fill="transparent" stroke="var(--rule-solid)" stroke-width="0.8"/>
      <text x="116" y="223" fill="var(--muted)" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">02</text>
      <text x="256" y="244" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle">Rebuild own mirrors in the shared window</text>
      <text x="256" y="260" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">EventKit → EventMirror · rebuilt on every sync</text>

      <rect x="96" y="304" width="320" height="64" rx="6" fill="var(--paper)"/>
      <rect x="96" y="304" width="320" height="64" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.3"/>
      <rect x="104" y="310" width="24" height="12" rx="2" fill="transparent" stroke="var(--rule-solid)" stroke-width="0.8"/>
      <text x="116" y="319" fill="var(--muted)" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">03</text>
      <text x="256" y="340" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle">Compute tombstones, write local cache first</text>
      <text x="256" y="356" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">LocalEventShadow diff → SwiftData upsert</text>

      <polygon points="600,144 720,96 840,144 720,192" fill="var(--paper)"/>
      <polygon points="600,144 720,96 840,144 720,192" fill="var(--accent-tint)" stroke="var(--accent)" stroke-width="1.2"/>
      <text x="720" y="141" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle">Settle pairing</text>
      <text x="720" y="157" fill="var(--accent)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">TwoPersonPairingPolicy</text>
      <rect x="568" y="120" width="24" height="12" rx="2" fill="transparent" stroke="var(--rule-solid)" stroke-width="0.8"/>
      <text x="580" y="129" fill="var(--muted)" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">04</text>

      <rect x="976" y="116" width="240" height="56" rx="20" fill="var(--paper)"/>
      <rect x="976" y="116" width="240" height="56" rx="20" fill="var(--surface)" stroke="var(--link)" stroke-width="1.3"/>
      <text x="1096" y="140" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle">Stop: show pairing conflict</text>
      <text x="1096" y="156" fill="var(--link)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">no upload, no import; user decides</text>

      <rect x="560" y="224" width="320" height="64" rx="6" fill="var(--paper)"/>
      <rect x="560" y="224" width="320" height="64" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.3"/>
      <rect x="568" y="230" width="24" height="12" rx="2" fill="transparent" stroke="var(--rule-solid)" stroke-width="0.8"/>
      <text x="580" y="239" fill="var(--muted)" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">05</text>
      <text x="720" y="260" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle">Upload only changed records</text>
      <text x="720" y="276" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">changedKeys · after reinstall: cloud tombstones</text>

      <rect x="560" y="320" width="320" height="64" rx="6" fill="var(--paper)"/>
      <rect x="560" y="320" width="320" height="64" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.3"/>
      <rect x="568" y="326" width="24" height="12" rx="2" fill="transparent" stroke="var(--rule-solid)" stroke-width="0.8"/>
      <text x="580" y="335" fill="var(--muted)" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">06</text>
      <text x="720" y="356" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle">Import partner's zones in parallel</text>
      <text x="720" y="372" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">5× CKFetchRecordZoneChanges · drop ex-partner</text>

      <rect x="560" y="416" width="320" height="64" rx="6" fill="var(--paper)"/>
      <rect x="560" y="416" width="320" height="64" rx="6" fill="var(--surface)" stroke="var(--ink)" stroke-width="1.3"/>
      <rect x="568" y="422" width="24" height="12" rx="2" fill="transparent" stroke="var(--rule-solid)" stroke-width="0.8"/>
      <text x="580" y="431" fill="var(--muted)" font-size="8" font-family="var(--font-mono)" text-anchor="middle" letter-spacing="0.08em">07</text>
      <text x="720" y="452" fill="var(--ink)" font-size="13" font-weight="600" text-anchor="middle">Retry failed decisions, then notify</text>
      <text x="720" y="468" fill="var(--muted)" font-size="10" font-family="var(--font-mono)" text-anchor="middle">re-upload decisions · LocalNotificationPolicy</text>
    </svg>
  </div>
</div>
</body>
</html>
