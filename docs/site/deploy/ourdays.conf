# /etc/nginx/conf.d/ourdays.conf   —— ourdays.cn 官网 HTTPS 配置
# 已部署到服务器 111.231.31.145 (ssh tencent), 系统 nginx 1.26.3, OpenCloudOS 9.6
# 证书: 腾讯云 TrustAsia C1 DV Free (SAN: ourdays.cn + www.ourdays.cn)
# 独立成文件放在 conf.d/, 未改动 nginx.conf 原有 default server(server_name _),
# 回退方式: 删除本文件 + `systemctl reload nginx` 即可。

# --- HTTP: ourdays.cn / www 明文请求 301 跳 HTTPS ---
server {
    listen       80;
    listen       [::]:80;
    server_name  ourdays.cn www.ourdays.cn;
    return 301 https://$host$request_uri;
}

# --- HTTPS ---
server {
    listen       443 ssl;
    listen       [::]:443 ssl;
    http2        on;
    server_name  ourdays.cn www.ourdays.cn;
    root         /usr/share/nginx/html;
    index        index.html;

    ssl_certificate     /etc/nginx/ssl/ourdays.cn/fullchain.crt;  # 腾讯云 *_bundle.crt(含中间证书链)
    ssl_certificate_key /etc/nginx/ssl/ourdays.cn/private.key;    # 腾讯云 *.key(私钥, 权限 600)

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS: 强制浏览器始终走 https。确认站点长期稳定后再取消注释(开启后回退 http 会被浏览器拒绝)。
    # add_header Strict-Transport-Security "max-age=31536000" always;

    error_page 404 /404.html;
    error_page 500 502 503 504 /50x.html;
}
