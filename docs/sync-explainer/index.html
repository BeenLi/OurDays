<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OurDays 同步逐步讲解</title>
</head>
<body>
<style>
/* Layout: a CloudKit-dashboard-like inspector. Three lanes (my device / iCloud / other device), one step at a time, diffs marked in the margin. */
:root{
  --bg:#EDF0F3; --paper:#FFFFFF; --sunk:#F5F7F9; --ink:#17202A; --muted:#5A6573; --line:#D3DAE2;
  --cloud:#1D63C9; --cloud-soft:#E3EDFB;
  --new:#1C7C52; --new-soft:#E2F3EA; --chg:#9A6512; --chg-soft:#FBF0DC; --del:#B53A28; --del-soft:#FBE6E2;
  --f-display:"Noto Serif SC","Songti SC",serif; --f-body:"Noto Sans SC","PingFang SC","Microsoft YaHei",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0F141A; --paper:#171E26; --sunk:#121820; --ink:#E4E9EF; --muted:#94A0AE; --line:#2A3440;
  --cloud:#6FA6F5; --cloud-soft:#18283E; --new:#5CC995; --new-soft:#132C21; --chg:#E3B05A; --chg-soft:#2E2412; --del:#F08571; --del-soft:#331A16; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0F141A; --paper:#171E26; --sunk:#121820; --ink:#E4E9EF; --muted:#94A0AE; --line:#2A3440;
  --cloud:#6FA6F5; --cloud-soft:#18283E; --new:#5CC995; --new-soft:#132C21; --chg:#E3B05A; --chg-soft:#2E2412; --del:#F08571; --del-soft:#331A16; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.65;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:28px 64px}
.wrap{max-width:1240px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
header h1{font-family:var(--f-display);font-weight:900;font-size:clamp(26px,4vw,38px);line-height:1.2;margin:0;text-wrap:balance}
header p{margin:6px 0 0;color:var(--muted);max-width:68ch}
.mono{font-family:var(--f-mono);font-size:.86em}
code{font-family:var(--f-mono);font-size:.88em;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:0 4px;word-break:break-all}
nav.chapters{display:flex;flex-wrap:wrap;gap:6px}
nav.chapters button{font:inherit;font-size:14px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:6px 12px;border-radius:999px;cursor:pointer}
nav.chapters button[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
nav.chapters button:focus-visible,.ctrl button:focus-visible,.dots button:focus-visible{outline:2px solid var(--cloud);outline-offset:2px}
.stage{background:var(--paper);border:1px solid var(--line);border-radius:10px;padding:20px;display:flex;flex-direction:column;gap:18px}
.stephead{display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline}
.stepno{font-family:var(--f-mono);font-size:13px;color:var(--muted);letter-spacing:.04em}
.stephead h2{font-family:var(--f-display);font-weight:600;font-size:clamp(20px,2.6vw,26px);margin:0;line-height:1.3;text-wrap:balance}
.badge{font-size:12px;padding:1px 8px;border-radius:999px;border:1px solid var(--chg);color:var(--chg);background:var(--chg-soft);white-space:nowrap}
.narr{max-width:80ch;display:flex;flex-direction:column;gap:8px}
.narr p{margin:0}
.lanes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px}
.lane{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:10px;min-width:0}
.lane.cloud{background:var(--cloud-soft);border-color:color-mix(in srgb,var(--cloud) 35%,var(--line))}
.lanehead{display:flex;justify-content:space-between;gap:8px;align-items:center;flex-wrap:wrap}
.lanehead b{font-size:13px;letter-spacing:.06em}
.lane.cloud .lanehead b{color:var(--cloud)}
.flow{font-size:12px;font-family:var(--f-mono);padding:1px 7px;border-radius:4px;background:var(--paper);border:1px solid var(--line);color:var(--muted)}
.flow.on{color:var(--cloud);border-color:var(--cloud)}
.empty{color:var(--muted);font-size:13px;font-style:italic}
.card{background:var(--paper);border:1px solid var(--line);border-radius:6px;overflow:hidden}
.card.tomb{border-color:var(--del)}
.card.ghost{opacity:.55}
.chead{padding:8px 10px;border-bottom:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.chead .top{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.kind{font-family:var(--f-mono);font-size:11px;padding:0 5px;border-radius:3px;border:1px solid var(--line);color:var(--muted)}
.kind.ck{border-color:var(--cloud);color:var(--cloud)}
.chead .name{font-weight:700;font-size:14px}
.chead .sub{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);word-break:break-all}
.tag{font-size:11px;padding:0 6px;border-radius:3px}
.tag.n{background:var(--new-soft);color:var(--new)} .tag.c{background:var(--chg-soft);color:var(--chg)} .tag.d{background:var(--del-soft);color:var(--del)}
table.f{width:100%;border-collapse:collapse;font-family:var(--f-mono);font-size:12px}
table.f td{padding:3px 8px;vertical-align:top;border-top:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
table.f tr:first-child td{border-top:0}
table.f td.k{color:var(--muted);white-space:nowrap;width:1%;border-left:3px solid transparent}
table.f td.v{word-break:break-all}
tr.s-n td.k{border-left-color:var(--new)} tr.s-n td.v{color:var(--new);background:var(--new-soft)}
tr.s-c td.k{border-left-color:var(--chg)} tr.s-c td.v{background:var(--chg-soft)}
tr.s-d td.k{border-left-color:var(--del)} tr.s-d td.v{color:var(--del);background:var(--del-soft)}
tr.s-x td{opacity:.45}
.old{text-decoration:line-through;color:var(--muted);margin-right:6px}
.arrow{color:var(--chg);margin-right:6px}
.cnote{padding:8px 10px;font-size:12.5px;color:var(--muted);border-top:1px solid var(--line);font-family:var(--f-body)}
.free{padding:10px;font-size:13px;display:flex;flex-direction:column;gap:6px}
.free pre{margin:0;font-family:var(--f-mono);font-size:12px;white-space:pre-wrap;word-break:break-all;background:var(--sunk);border:1px solid var(--line);border-radius:4px;padding:8px}
.callout{border-left:3px solid var(--chg);background:var(--chg-soft);padding:10px 14px;border-radius:0 6px 6px 0;max-width:80ch}
.callout.bad{border-color:var(--del);background:var(--del-soft)}
.callout.good{border-color:var(--new);background:var(--new-soft)}
.callout b{display:block;margin-bottom:2px}
.refs{display:flex;flex-wrap:wrap;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.refs code{font-size:11.5px}
.ctrl{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ctrl>button{font:inherit;border:1px solid var(--ink);background:var(--ink);color:var(--bg);padding:8px 18px;border-radius:6px;cursor:pointer;min-width:110px}
.ctrl>button.sec{background:transparent;color:var(--ink)}
.ctrl>button:disabled{opacity:.35;cursor:default}
.dots{display:flex;gap:5px;flex-wrap:wrap;justify-content:center;flex:1}
.dots button{width:22px;height:22px;border-radius:50%;border:1px solid var(--line);background:var(--paper);font-family:var(--f-mono);font-size:10px;color:var(--muted);cursor:pointer;padding:0}
.dots button.cur{background:var(--cloud);border-color:var(--cloud);color:#fff}
.legend{display:flex;flex-wrap:wrap;gap:10px 18px;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px;background:var(--c)}
footer{font-size:12.5px;color:var(--muted);max-width:90ch}
@media (max-width:900px){.lanes{grid-template-columns:minmax(0,1fr)}}
@media (prefers-reduced-motion:no-preference){.stage .card{animation:in .25s ease-out}@keyframes in{from{transform:translateY(4px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="wrap">
  <header>
    <h1>一条日程在 iCloud 里的一生</h1>
    <p>按 main 分支（b00a5fa）的代码，一步步看阿力的一条日程怎么变成 CloudKit 记录、怎么被修改和删除、小雨的评论挂在哪里，以及小雨的手机和阿力自己的 Mac 怎么读这些记录。字段名都是代码里的真名，示例值是编的。</p>
  </header>

  <nav class="chapters" id="chapters" aria-label="章节"></nav>

  <section class="stage" aria-live="polite">
    <div class="stephead"><span class="stepno" id="stepno"></span><h2 id="title"></h2><span id="badge"></span></div>
    <div class="narr" id="narr"></div>
    <div class="lanes" id="lanes"></div>
    <div id="callout"></div>
    <div class="refs" id="refs"></div>
    <div class="ctrl">
      <button class="sec" id="prev" type="button">← 上一步</button>
      <div class="dots" id="dots"></div>
      <button id="next" type="button">下一步 →</button>
    </div>
  </section>

  <div class="legend">
    <span style="--c:var(--new)">这一步新写入的字段</span>
    <span style="--c:var(--chg)">这一步改了的字段（划线是旧值）</span>
    <span style="--c:var(--del)">删除标记 / 被删掉</span>
    <span style="--c:var(--line)">没变</span>
    <span>键盘 ← → 也能翻页</span>
  </div>

  <footer>示例人物：阿力（我，CloudKit 用户 ID <code>_7f3a…e1</code>）和小雨（对方，<code>_c29b…4d</code>）。日历 ID、事件 ID 都缩写了。时间为北京时间，云端实际存的是 UTC 时间戳。</footer>
</div>

<script>
const ME="_7f3a…e1", PA="_c29b…4d", CAL="4B7E…C1", EID="9D2A…F0";
const E1=1795865400, E2=1795867200;
const K1=`${CAL}:${EID}:${E1}`, K2=`${CAL}:${EID}:${E2}`;
const T1="2026-11-28 19:30", T1e="2026-11-28 21:30", T2="2026-11-28 20:00", T2e="2026-11-28 22:00";
const NOW1="2026-11-24 20:05", NOW2="2026-11-25 09:12", NOW3="2026-11-26 18:40";
const CMT="E3B1…7A";

// field helper: [key, value, state, old]  state: n new, c changed, d deleted, x absent/nil
const mirrorFields=(o={})=>{
  const base=[
    ["ownerMemberID",ME],["mirrorKey",K1],["sourceCalendarID",CAL],["sourceCalendarTitle","个人"],
    ["occurrenceStartDate",T1],["startDate",T1],["endDate",T1e],["isAllDay","0"],
    ["timeZoneIdentifier","Asia/Shanghai"],["title","看电影"],["location","万象城 IMAX"],
    ["notes","记得带 3D 眼镜"],["urlString","nil","x"],["calendarColorHex","#34AADC"],
    ["visibilityRawValue","fullDetails"],["deletedAt","nil","x"]];
  return base.map(([k,v,s])=>{ if(o[k]!==undefined){const r=o[k];return [k,...r];} return [k,v,s||o._all||""]; });
};
const ckMirror=(name,fo,extra={})=>({kind:"CKRecord",ck:true,name:"EventMirror",sub:[`recordName = ${name}`,`zone CoupleSpace · owner 阿力`,`parent → couple-space-root`],f:fo,...extra});

const lanesStd=["阿力的 iPhone（我）","iCloud","小雨的 iPhone（对方）"];
const lanesMac=["阿力的 iPhone","iCloud · 阿力自己的库","阿力的 Mac（同一 Apple ID）"];

const CH=[
{name:"上传",steps:[
{t:"从系统日历读出一条日程",
 n:["每次同步，<code>SyncCoordinator.foregroundSync</code> 先算出“共享窗口”：配对那天往后，再加上对方被批准查看的历史区间。然后只在用户勾选的日历里，用 EventKit 读出窗口里的日程。","这时日程还只是内存里的 <code>CalendarSourceEvent</code>。有一个字段要记住：<code>occurrenceStartDate</code> 取的是 <code>occurrenceDate ?? startDate</code>。重复日程的某一次用“这一次原本的日期”，普通日程就是开始时间。后面改时间的故事就从这里开始。"],
 L:[[{kind:"内存",name:"CalendarSourceEvent",sub:["EventKit 读出，不落盘"],f:[["calendarIdentifier",CAL,"n"],["eventIdentifier",EID,"n"],["occurrenceStartDate",`${T1}  ← occurrenceDate ?? startDate`,"n"],["startDate",T1,"n"],["endDate",T1e,"n"],["isAllDay","false","n"],["title","看电影","n"],["location","万象城 IMAX","n"],["notes","记得带 3D 眼镜","n"],["url","nil","x"],["calendarTitle","个人","n"],["calendarColorHex","#34AADC","n"]]}],
    [{kind:"CKRecord",ck:true,name:"CoupleSpace",sub:["recordName = couple-space-root","zone CoupleSpace（阿力的私有库）"],f:[["ownerMemberID",ME],["…","CKShare 挂在这条根记录上"]],note:"配对时建好。zone 里所有记录都以它为 parent，所以整片分享给了小雨。"}],
    []],
 flow:["读 EventKit","",""],
 refs:["CalendarAccessService.swift:269","SyncCoordinator.swift:105","CalendarSharingWindowPolicy"]},
{t:"算出 mirrorKey 和 fingerprint，按可见程度裁剪",
 n:["<code>EventMirrorKeyPolicy.makeMirrorKey</code> 把三段拼起来：<b>日历 ID : 事件 ID : 发生时间的秒数</b>。事件 ID 为空时用 fingerprint 顶上。这个字符串同时是本地 id、CloudKit 记录名、评论挂靠的锚点，是整个系统里最重要的一根线。","fingerprint 是“内容指纹”，下一次同步拿它判断内容有没有变。可见程度决定哪些字段上传：<code>busyOnly</code> 只传标题 “Busy”，<code>titleAndLocation</code> 传标题和地点，<code>fullDetails</code> 全传，<code>hidden</code> 整条不生成。"],
 L:[[{kind:"计算",name:"mirrorKey",free:`<pre>"\(calendarIdentifier):\(stableEventID):\(occurrenceEpoch)"

= ${K1}</pre>`},
     {kind:"计算",name:"fingerprint",free:`<pre>eventID | calID | startEpoch | endEpoch
| title | location | notes | url

= ${EID}|${CAL}|${E1}|1795872600|看电影|万象城 IMAX|记得带 3D 眼镜|</pre>`}],
    [],[]],
 flow:["计算","",""],
 refs:["CalendarSourcePolicies.swift:114","EventServices.swift:4 makeMirrors","EventServices.swift:170 visibleFields"]},
{t:"本地先记两份：镜像和影子",
 n:["上传前，iPhone 在 SwiftData 里写两样东西。<code>EventMirror</code> 是要发给对方的那份副本。<code>LocalEventShadow</code> 是“我上次看到这条日程是什么样”的备忘，只存在上传方本机，对方和云端都没有。","影子的 <code>lastUploadedAt</code> 这时故意留空。只有 CloudKit 确认写入成功，才盖上时间戳。这样配对之前同步过的日程，配对之后还会补传一次。"],
 L:[[{kind:"SwiftData",name:"EventMirror",sub:[`id = ${K1}`],f:mirrorFields({_all:"n",urlString:["nil","x"],deletedAt:["nil","x"]}).concat([["cloudKitRecordName",K1,"n"]])},
     {kind:"SwiftData",name:"LocalEventShadow",sub:[`id = ${K1}`],f:[["localEventIdentifier",EID,"n"],["calendarIdentifier",CAL,"n"],["occurrenceStartDate",T1,"n"],["fingerprint",`${EID}|…|看电影|…`,"n"],["cloudKitRecordName",K1,"n"],["lastUploadedAt","nil  ← 还没确认","x"],["isTombstone","false","n"]]}],
    [],[]],
 flow:["写本地","",""],
 refs:["EventServices.swift:47 makeShadows","SyncCoordinator.swift:267","Models.swift:138"]},
{t:"写进 iCloud",
 n:["<code>saveMirrorsForSync</code> 先按记录名把云端已有的记录取回来，在它上面改字段再存（没有就新建），保存策略是 <code>.changedKeys</code>，非原子。记录放进阿力私有库的 <code>CoupleSpace</code> zone，parent 指向 <code>couple-space-root</code>，所以自动落进分享范围，小雨能读到。","云端 16 个字段和本地镜像一一对应。本地的 <code>id</code> 和 <code>cloudKitRecordName</code> 不是字段，它们就是记录名本身。写成功后，影子盖上 <code>lastUploadedAt</code>。"],
 L:[[{kind:"SwiftData",name:"LocalEventShadow",sub:[`id = ${K1}`],f:[["localEventIdentifier",EID],["calendarIdentifier",CAL],["occurrenceStartDate",T1],["fingerprint",`${EID}|…|看电影|…`],["cloudKitRecordName",K1],["lastUploadedAt",NOW1,"c","nil"],["isTombstone","false"]]}],
    [ckMirror(K1,mirrorFields({_all:"n",urlString:["nil","x"],deletedAt:["nil","x"]}),{tagN:"新建"})],
    []],
 flow:["上传 ↗","收到",""],
 refs:["CloudKitCoupleSpaceService.swift:953","CloudKitRecordMappers.swift:379","SyncCoordinator.swift:429"]},
{t:"小雨的手机拿到一份副本",
 n:["写入会让小雨的设备收到静默推送，触发她那边的同步。她从 <code>sharedDatabase</code> 里读阿力的 zone，把记录变成本地 <code>EventMirror</code>。细节在“对方本地”一章。","注意：小雨那边没有影子。影子只属于“这条日程的主人”。"],
 L:[[],[ckMirror(K1,mirrorFields())],
    [{kind:"SwiftData",name:"EventMirror",sub:[`id = ${K1}`,"导入自 阿力的 zone"],f:mirrorFields({_all:"n",ownerMemberID:[`${ME}  ← 取自 zone 主人`,"n"],urlString:["nil","x"],deletedAt:["nil","x"]})}]],
 flow:["","↘ 推送","读取"],
 refs:["CloudKitCoupleSpaceService.swift:1482","CloudKitPolicies.swift:236"]}
]},
{name:"修改",steps:[
{t:"改标题和备注，时间不动",
 n:["阿力在系统日历里把标题改成“看《沙丘3》”，备注删掉了。下次同步算出的 mirrorKey 没变，但 fingerprint 变了。<code>CloudKitMirrorSyncPolicy.mirrorsNeedingUpload</code> 发现内容和本地旧镜像不同，就把它列入上传。","云端还是同一条记录，原地更新。小雨那边按 mirrorKey 找到原来那条，逐个字段覆盖，挂在上面的评论原封不动。"],
 L:[[{kind:"SwiftData",name:"LocalEventShadow",sub:[`id = ${K1}`],f:[["fingerprint",`${EID}|…|看《沙丘3》|万象城 IMAX||`,"c",`${EID}|…|看电影|…|记得带 3D 眼镜|`],["lastUploadedAt",NOW2,"c",NOW1],["isTombstone","false"]]}],
    [ckMirror(K1,mirrorFields({title:["看《沙丘3》","c","看电影"],notes:["nil","c","记得带 3D 眼镜"]}),{tagC:"原地更新"})],
    [{kind:"SwiftData",name:"EventMirror",sub:[`id = ${K1}`],f:[["mirrorKey",K1],["title","看《沙丘3》","c","看电影"],["notes","nil","c","记得带 3D 眼镜"],["…","其余字段不变"]]}]],
 flow:["上传 ↗","更新","读取"],
 refs:["SyncPolicies.swift:166","Models.swift:333 EventMirrorStore.upsert"]},
{t:"改时间：1.9 及以前的做法",
 badge:"线上版本",
 bad:true,
 n:["把 19:30 挪到 20:00。普通日程的 <code>occurrenceDate</code> 就等于开始时间，于是 mirrorKey 末尾的秒数从 <code>1795865400</code> 变成 <code>1795867200</code>，成了另一把钥匙。","同步看到：旧钥匙 K1 不在本次算出的钥匙里，于是把旧影子标成墓碑，旧镜像写上 <code>deletedAt</code>；新钥匙 K2 当作一条新日程上传。云端出现两条记录，一条死的，一条新的。"],
 L:[[{kind:"SwiftData",name:"LocalEventShadow",sub:[`id = ${K1}`],tomb:true,f:[["occurrenceStartDate",T1],["isTombstone","true","d","false"]]},
     {kind:"SwiftData",name:"LocalEventShadow",sub:[`id = ${K2}`],f:[["occurrenceStartDate",T2,"n"],["fingerprint",`${EID}|…|${E2}|1795874400|看《沙丘3》|…`,"n"],["lastUploadedAt",NOW2,"n"],["isTombstone","false","n"]]}],
    [ckMirror(K1,[["mirrorKey",K1],["startDate",T1],["title","看《沙丘3》"],["deletedAt",NOW2,"d","nil"],["…","其余字段保留旧值"]],{tomb:true,tagD:"墓碑"}),
     ckMirror(K2,[["mirrorKey",K2,"n"],["occurrenceStartDate",T2,"n"],["startDate",T2,"n"],["endDate",T2e,"n"],["title","看《沙丘3》","n"],["…","其余字段同上，全是新写入"]],{tagN:"新建"})],

// flatten
const STEPS=[]; CH.forEach((c,ci)=>c.steps.forEach((s,si)=>STEPS.push({...s,ci,si,lanes:s.lanes||c.lanes||lanesStd})));
let cur=0;
try{const v=parseInt(localStorage.getItem("od-walk-step"),10); if(v>=0&&v<STEPS.length) cur=v;}catch(e){}

const esc=s=>String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
function card(c){
  const cls=["card",c.tomb?"tomb":"",c.ghost?"ghost":""].join(" ");
  let tag="";
  if(c.tagN) tag=`<span class="tag n">${c.tagN}</span>`;
  if(c.tagC) tag=`<span class="tag c">${c.tagC}</span>`;
  if(c.tagD) tag=`<span class="tag d">${c.tagD}</span>`;
  let h=`<div class="${cls}"><div class="chead"><div class="top"><span class="kind ${c.ck?"ck":""}">${esc(c.kind)}</span><span class="name">${esc(c.name)}</span>${tag}</div>`;
  (c.sub||[]).forEach(s=>h+=`<div class="sub">${esc(s)}</div>`);
  h+=`</div>`;
  if(c.free) h+=`<div class="free">${c.free}</div>`;
  if(c.f){
    h+=`<table class="f">`;
    c.f.forEach(([k,v,s,old])=>{
      const st=s?`s-${s}`:"";
      const ov=(s==="c"||s==="d")&&old!==undefined?`<span class="old">${esc(old)}</span><span class="arrow">→</span>`:"";
      h+=`<tr class="${st}"><td class="k">${esc(k)}</td><td class="v">${ov}${esc(v)}</td></tr>`;
    });
    h+=`</table>`;
  }
  if(c.note) h+=`<div class="cnote">${esc(c.note)}</div>`;
  return h+`</div>`;
}

  const s=STEPS[cur];

  document.getElementById("title").textContent=s.t;
  document.getElementById("badge").innerHTML=s.badge?`<span class="badge">${s.badge}</span>`:"";
  document.getElementById("narr").innerHTML=s.n.map(p=>`<p>${p}</p>`).join("");
  document.getElementById("lanes").innerHTML=s.lanes.map((name,i)=>{
    const cards=s.L[i]||[]; const fl=(s.flow||[])[i]||"";
    return `<div class="lane ${i===1&&!s.plain?"cloud":""}"><div class="lanehead"><b>${esc(name)}</b>${fl?`<span class="flow on">${esc(fl)}</span>`:""}</div>${cards.length?cards.map(card).join(""):`<div class="empty">这一步这里没有变化</div>`}</div>`;
  }).join("");
  document.getElementById("callout").innerHTML=s.call?`<div class="callout ${s.call.cls}"><b>${s.call.h}</b>${s.call.b}</div>`:"";
  document.getElementById("refs").innerHTML=`<span>代码：</span>`+s.refs.map(r=>`<code>${esc(r)}</code>`).join("");
  document.getElementById("dots").innerHTML=STEPS.map((x,i)=>`<button type="button" data-i="${i}" class="${i===cur?"cur":""}" aria-label="第 ${i+1} 步：${esc(x.t)}" title="${esc(x.t)}">${i+1}</button>`).join("");
  document.getElementById("prev").disabled=cur===0;
  document.getElementById("next").disabled=cur===STEPS.length-1;
  try{localStorage.setItem("od-walk-step",String(cur));}catch(e){}
}
function go(i){cur=Math.max(0,Math.min(STEPS.length-1,i));render();}
document.getElementById("prev").onclick=()=>go(cur-1);
document.getElementById("next").onclick=()=>go(cur+1);
document.getElementById("dots").onclick=e=>{const b=e.target.closest("button[data-i]");if(b)go(+b.dataset.i);};
document.getElementById("chapters").onclick=e=>{const b=e.target.closest("button[data-ch]");if(b)go(STEPS.findIndex(x=>x.ci===+b.dataset.ch));};
document.addEventListener("keydown",e=>{if(e.target.closest("input,textarea"))return;if(e.key==="ArrowRight")go(cur+1);if(e.key==="ArrowLeft")go(cur-1);});
render();
</script>

</body>
</html>
